<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشعب والفصول - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>إدارة الشعب والفصول الدراسية</h1>
        <nav>
            <a href="/school-platform/index.html">الرئيسية</a>
            <a href="/school-platform/pages/academic-years.html">السنوات الدراسية</a>
            <a href="/school-platform/pages/semesters.html">الفصول الدراسية</a>
            <a href="/school-platform/pages/grades.html">الصفوف الدراسية</a>
            <a href="/school-platform/pages/subjects.html">المواد الدراسية</a>
            <a href="/school-platform/pages/grade-subjects.html">ربط المواد</a>
            <a href="/school-platform/pages/teachers.html">المعلمين</a>
            <a href="/school-platform/pages/students.html">الطلاب</a>
            <a href="/school-platform/pages/sections.html">الشعب والفصول</a>
            <a href="/school-platform/pages/guardians.html">أولياء الأمور</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>إضافة شعبة جديدة</h2>
            <form id="add-section-form">
                <div class="form-group">
                    <label for="section-name">اسم الشعبة (أو الفصل):</label>
                    <input type="text" id="section-name" required placeholder="مثال: الشعبة الأولى، أو أ، أو ب">
                </div>
                <div class="form-group">
                    <label for="section-grade">الصف الدراسي:</label>
                    <select id="section-grade" required>
                        <option value="">-- اختر الصف الدراسي --</option>
                    </select>
                </div>
                <button type="submit">إضافة الشعبة</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة الشعب والفصول المسجلة</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الشعبة</th>
                        <th>الصف الدراسي</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/sections.js"></script>
</body>
</html>
