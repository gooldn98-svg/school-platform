<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلاب - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>إدارة الطلاب</h1>
        <nav>
            <a href="/school-platform/index.html">الرئيسية</a>
            <a href="/school-platform/pages/academic-years.html">السنوات الدراسية</a>
            <a href="/school-platform/pages/semesters.html">الفصول الدراسية</a>
            <a href="/school-platform/pages/grades.html">الصفوف الدراسية</a>
            <a href="/school-platform/pages/subjects.html">المواد الدراسية</a>
            <a href="/school-platform/pages/grade-subjects.html">ربط المواد</a>
            <a href="/school-platform/pages/teachers.html">المعلمين</a>
            <a href="/school-platform/pages/students.html">الطلاب</a>
            <a href="/school-platform/pages/sections.html">الشعب والفصول</a>
            <a href="/school-platform/pages/guardians.html">أولياء الأمور</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>تسجيل طالب جديد</h2>
            <form id="add-student-form">
                <div class="form-group">
                    <label for="student-name">اسم الطالب:</label>
                    <input type="text" id="student-name" required placeholder="أدخل اسم الطالب الرباعي">
                </div>
                <div class="form-group">
                    <label for="student-grade">الصف الدراسي:</label>
                    <select id="student-grade" required>
                        <option value="">-- اختر الصف الدراسي --</option>
                    </select>
                </div>
                <button type="submit">إضافة الطالب</button>
            </form>
        </section>

        <!-- قسم إدارة الملفات (إكسل) -->
        <section class="excel-section" style="margin: 20px 0; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;">
            <h3>استيراد وتصدير بيانات الطلاب (Excel)</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <button id="download-template-btn" style="background-color: #0d9488; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">تحميل نموذج الإكسل</button>
                
                <label for="excel-file-input" style="background-color: #2563eb; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; display: inline-block;">
                    استيراد الطلاب من إكسل
                </label>
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;">

                <button id="export-students-btn" style="background-color: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">تصدير قائمة الطلاب</button>
            </div>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة الطلاب المسجلين</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف الدراسي</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- مكتبة قراءة وتصدير ملفات الإكسل SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/students.js"></script>
</body>
</html>
