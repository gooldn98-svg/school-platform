<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفصول الدراسية - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>إدارة الفصول الدراسية</h1>
        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="academic-years.html">السنوات الدراسية</a>
            <a href="grades.html">الصفوف الدراسية</a>
            <a href="subjects.html">المواد الدراسية</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>إضافة فصل دراسي جديد</h2>
            <form id="add-semester-form">
                <div class="form-group">
                    <label for="academic-year-select">السنة الدراسية:</label>
                    <select id="academic-year-select" required>
                        <option value="">جاري تحميل السنوات...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="semester-name">اسم الفصل الدراسي (مثال: الفصل الأول):</label>
                    <input type="text" id="semester-name" required placeholder="أدخل اسم الفصل الدراسي">
                </div>
                <div class="form-group">
                    <label for="start-date">تاريخ البداية (اختياري):</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label for="end-date">تاريخ النهاية (اختياري):</label>
                    <input type="date" id="end-date">
                </div>
                <button type="submit">إضافة الفصل الدراسي</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة الفصول الدراسية</h2>
            <table>
                <thead>
                    <tr>
                        <th>الفصل الدراسي</th>
                        <th>السنة الدراسية</th>
                        <th>تاريخ البداية</th>
                        <th>تاريخ النهاية</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/semesters.js"></script>
</body>
</html>
