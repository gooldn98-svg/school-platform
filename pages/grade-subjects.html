<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربط المواد بالصفوف - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>ربط المواد بالصفوف الدراسية</h1>
        <nav>
    <a href="/school-platform/index.html">الرئيسية</a>
    <a href="academic-years.html">السنوات الدراسية</a>
    <a href="semesters.html">الفصول الدراسية</a>
    <a href="grades.html">الصفوف الدراسية</a>
    <a href="subjects.html">المواد الدراسية</a>
    <a href="grade-subjects.html">ربط المواد</a>
</nav>
    </header>

    <main>
        <section class="form-section">
            <h2>ربط مادة دراسية بصف دراسي</h2>
            <form id="add-grade-subject-form">
                <div class="form-group">
                    <label for="grade-select">اختر الصف الدراسي:</label>
                    <select id="grade-select" required>
                        <option value="">-- جاري تحميل الصفوف --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject-select">اختر المادة الدراسية:</label>
                    <select id="subject-select" required>
                        <option value="">-- جاري تحميل المواد --</option>
                    </select>
                </div>

                <button type="submit">إتمام الربط</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة المواد المرتبطة بالصفوف</h2>
            <table>
                <thead>
                    <tr>
                        <th>الصف الدراسي</th>
                        <th>المادة الدراسية</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/grade-subjects.js"></script>
</body>
</html>
