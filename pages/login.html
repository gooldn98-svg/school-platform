<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- تحميل مكتبة Supabase عبر CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <p>دخول مالك المنصة</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="gooldn98@gmail.com">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>

            <button type="submit" id="submit-btn">دخول</button>
        </form>

        <div id="login-message" style="margin-top: 15px; font-weight: bold;"></div>

        <p style="margin-top: 20px;">
            <a href="../index.html">العودة إلى الصفحة الرئيسية</a>
        </p>
    </div>

    <!-- استدعاء ملفات JavaScript بالترتيب الصحيح -->
    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
