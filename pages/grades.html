<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الصفوف الدراسية - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>إدارة الصفوف الدراسية</h1>
        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="academic-years.html">السنوات الدراسية</a>
            <a href="semesters.html">الفصول الدراسية</a>
        </nav>
    </header>

    <main>
        <!-- نموذج إضافة صف دراسي جديد -->
        <section class="form-section">
            <h2>إضافة صف دراسي جديد</h2>
            <form id="add-grade-form">
                <div class="form-group">
                    <label for="grade-name">اسم الصف الدراسي (مثل: الصف الأول الثانوي):</label>
                    <input type="text" id="grade-name" required placeholder="أدخل اسم الصف">
                </div>
                <div class="form-group">
                    <label for="grade-description">ملاحظات أو وصف (اختياري):</label>
                    <input type="text" id="grade-description" placeholder="أدخل وصفاً مبسطاً">
                </div>
                <button type="submit">إضافة الصف</button>
            </form>
        </section>

        <hr>

        <!-- جدول عرض الصفوف الدراسية -->
        <section class="table-section">
            <h2>قائمة الصفوف الدراسية</h2>
            <table id="grades-table">
                <thead>
                    <tr>
                        <th>اسم الصف</th>
                        <th>الوصف</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/grades.js"></script>
</body>
</html>
