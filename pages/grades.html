<!DOCTYPE html>

<head>

<body>
    <header>
        <h1>إدارة الصفوف الدراسية</h1>
       <nav>

    <main>
        <section class="form-section">
            <h2>إضافة صف دراسي جديد</h2>
            <form id="add-grade-form">
                <div class="form-group">
                    <label for="grade-name">اسم الصف (مثال: الأول الثانوي):</label>
                    <input type="text" id="grade-name" required placeholder="أدخل اسم الصف">
                </div>
                <button type="submit">إضافة الصف</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة الصفوف الدراسية</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم الصف</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="2">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
