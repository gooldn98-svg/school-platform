<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواد الدراسية - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>إدارة المواد الدراسية</h1>
        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="academic-years.html">السنوات الدراسية</a>
            <a href="semesters.html">الفصول الدراسية</a>
            <a href="grades.html">الصفوف الدراسية</a>
        </nav>
    </header>

    <main>
        <!-- نموذج إضافة مادة دراسية جديدة -->
        <section class="form-section">
            <h2>إضافة مادة دراسية جديدة</h2>
            <form id="add-subject-form">
                <div class="form-group">
                    <label for="subject-name">اسم المادة (مثل: رياضيات، فيزياء):</label>
                    <input type="text" id="subject-name" required placeholder="أدخل اسم المادة">
                </div>
                <div class="form-group">
                    <label for="subject-code">رمز المادة (اختياري):</label>
                    <input type="text" id="subject-code" placeholder="مثل: MATH101">
                </div>
                <button type="submit">إضافة المادة</button>
            </form>
        </section>

        <hr>

        <!-- جدول عرض المواد الدراسية -->
        <section class="table-section">
            <h2>قائمة المواد الدراسية</h2>
            <table id="subjects-table">
                <thead>
                    <tr>
                        <th>اسم المادة</th>
                        <th>رمز المادة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/subjects.js"></script>
</body>
</html>
