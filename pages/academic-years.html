<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السنوات الدراسية - منصة المدرسة</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>إدارة السنوات الدراسية</h1>
        <nav>
            <a href="../index.html">الرئيسية</a>
            <a href="semesters.html">الفصول الدراسية</a>
            <a href="grades.html">الصفوف الدراسية</a>
            <a href="subjects.html">المواد الدراسية</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>إضافة سنة دراسية جديدة</h2>
            <form id="add-year-form">
                <div class="form-group">
                    <label for="year-name">السنة الدراسية (مثال: 2025/2026):</label>
                    <input type="text" id="year-name" required placeholder="أدخل السنة الدراسية">
                </div>
                <div class="form-group">
                    <label for="start-date">تاريخ بداية السنة (اختياري):</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label for="end-date">تاريخ نهاية السنة (اختياري):</label>
                    <input type="date" id="end-date">
                </div>
                <button type="submit">إضافة السنة الدراسية</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>قائمة السنوات الدراسية</h2>
            <table>
                <thead>
                    <tr>
                        <th>السنة الدراسية</th>
                        <th>تاريخ البداية</th>
                        <th>تاريخ النهاية</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4">جاري التحميل...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/academic-years.js"></script>
</body>
</html>
